<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>To-Do List</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }
    #todoList {
      border-collapse: collapse;
      width: 70%;
      margin: 0 auto;
    }
    #todoList th, #todoList td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }
    #todoList th {
      background-color: #f0f0f0;
    }
    #todoList th:first-child, #todoList th:last-child {
      width: 5%;
    }
    #todoList th:nth-child(2) {
      width: 90%;
    }
    .add-form {
      margin-top: 20px;
      width: 70%;
      margin: 20px auto;
    }
    .add-form input[type="text"] {
      padding: 8px;
      width: 70%;
    }
    .add-form button {
      padding: 8px;
      width: 20%;
    }
    /* Новые стили для auth блока */
    #authBlock {
      width: 70%;
      margin: 10px auto;
      padding: 10px;
      border: 1px solid #ccc;
      text-align: center;
      background-color: #fafafa;
    }
    #authBlock form {
      display: inline-block;
      margin: 0 10px;
    }
    #authBlock input {
      padding: 6px;
      margin: 5px;
      width: 140px;
    }
    #authBlock button {
      padding: 6px 12px;
      margin: 5px;
    }
  </style>
</head>
<body>

<h2 style="text-align: center;">To-Do List</h2>
{{auth}}

<!-- Здесь будет блок с логином/регистрацией или приветствием -->
<div id="authBlock">
  {{auth}}
</div>

<table id="todoList">
  <thead>
    <tr>
      <th>#</th>
      <th>Task</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    {{rows}}
  </tbody>
</table>

<form class="add-form" method="POST" action="/add">
  <input type="text" name="text" placeholder="Enter new task" required />
  <button type="submit">Add</button>
</form>

</body>
</html>
